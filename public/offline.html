<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>AudioLad Studio · Sin conexión</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #e8fff9; font: 16px/1.6 system-ui, sans-serif; padding: 24px; }
      .card { max-width: 460px; border: 1px solid #1d5f51; border-radius: 20px; padding: 34px; background: #020504; box-shadow: 0 24px 80px rgba(47,243,207,.08); text-align: center; }
      .bars { display: flex; gap: 7px; align-items: flex-end; justify-content: center; height: 76px; margin-bottom: 22px; }
      .bars i { width: 10px; border-radius: 8px; background: #2ff3cf; box-shadow: 0 0 18px rgba(47,243,207,.35); }
      h1 { font-size: 1.6rem; margin: 0 0 8px; }
      p { color: #7ea79c; margin: 0 0 20px; }
      a { display: inline-block; background: #2ff3cf; color: #001511; font-weight: 800; text-decoration: none; padding: 11px 22px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="bars" aria-hidden="true">
        <i style="height:26%"></i><i style="height:58%"></i><i style="height:100%"></i><i style="height:44%"></i><i style="height:72%"></i>
      </div>
      <h1>Sin conexión</h1>
      <p>Tu biblioteca, la cola y la cabina siguen en este dispositivo. Vuelve a intentarlo cuando recuperes la red.</p>
      <a href="./">Reintentar</a>
    </main>
  </body>
</html>
